[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; NimBLE pinned to 1.4.x: 2.x renamed every callback signature.
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    h2zero/NimBLE-Arduino@~1.4.3
; NimBLE + Arduino core overflow the default 1.2 MB app partition.
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0  ; our own IMU_FAIL/DHT_FAIL counters replace the core's error spam
