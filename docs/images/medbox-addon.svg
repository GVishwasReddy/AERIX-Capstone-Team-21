<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Optional AERIX MedBox add-on</title><desc id="desc">The ESP32 monitors package conditions and reports status through the Pi bridge to the GCS. Core AERIX flight and release authority remain independent.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33866b"/></marker><style>.bg{fill:#f4f8fb}.opt{fill:#eef7f3;stroke:#33866b;stroke-width:4;rx:22}.core{fill:#e7f2f8;stroke:#236b8e;stroke-width:4;rx:22}.t{font:700 24px system-ui,sans-serif;fill:#153247}.s{font:17px system-ui,sans-serif;fill:#39576b}.a{stroke:#33866b;stroke-width:4;marker-end:url(#arrow)}.dash{stroke:#236b8e;stroke-width:3;stroke-dasharray:10 8}</style></defs><rect class="bg" width="1200" height="520" rx="24"/><text x="55" y="58" class="t" font-size="30">MedBox · optional payload monitor</text><rect class="opt" x="55" y="155" width="280" height="190"/><text x="98" y="205" class="t">ESP32 box</text><text x="88" y="244" class="s">Temperature / humidity</text><text x="88" y="274" class="s">Impact / lid / battery</text><text x="88" y="310" class="s">Latched integrity state</text><rect class="opt" x="455" y="155" width="280" height="190"/><text x="488" y="205" class="t">Pi payload bridge</text><text x="487" y="244" class="s">Separate USB Bluetooth</text><text x="487" y="274" class="s">Authenticated commands</text><text x="487" y="310" class="s">Status and drop window</text><rect class="core" x="855" y="155" width="280" height="190"/><text x="895" y="205" class="t">GCS / OLED</text><text x="888" y="244" class="s">Advisory status display</text><text x="888" y="274" class="s">Operator selects payload</text><text x="888" y="310" class="s">No flight authority</text><path class="a" d="M335 250h110M735 250h110"/><text x="355" y="225" class="s">BLE</text><text x="750" y="225" class="s">local status</text><rect class="core" x="350" y="400" width="500" height="80"/><text x="405" y="448" class="t">Core flight stack keeps release authority</text><path class="dash" d="M600 345v53"/><path class="dash" d="M850 440h180v-80"/><text x="866" y="474" class="s">Advisory path only</text></svg>
