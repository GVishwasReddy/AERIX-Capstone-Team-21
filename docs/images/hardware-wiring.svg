<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">AERIX hardware connections</title><desc id="desc">The Pi connects to the Pixhawk over USB and manages sensors, GCS, BLE, and optional MedBox monitoring.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#236b8e"/></marker><style>.bg{fill:#f4f8fb}.core{fill:#e7f2f8;stroke:#236b8e;stroke-width:4;rx:22}.box{fill:#fff;stroke:#7896a8;stroke-width:3;rx:16}.opt{fill:#eef7f3;stroke:#33866b;stroke-width:3;rx:16}.t{font:700 23px system-ui,sans-serif;fill:#153247}.s{font:17px system-ui,sans-serif;fill:#39576b}.a{stroke:#236b8e;stroke-width:4;marker-end:url(#arrow)}.b{stroke:#33866b;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1200" height="620" rx="24"/><text x="54" y="58" class="t" font-size="30">AERIX · hardware connections (conceptual)</text><rect class="core" x="390" y="205" width="420" height="210"/><text x="480" y="255" class="t" font-size="27">Raspberry Pi 5</text><text x="440" y="294" class="s">Companion software · GCS · navigation</text><text x="440" y="326" class="s">LiDAR processing · BLE services</text><rect class="box" x="58" y="120" width="250" height="105"/><text x="90" y="163" class="t">Pixhawk</text><text x="90" y="194" class="s">MAVLink · servo output</text><rect class="box" x="58" y="380" width="250" height="105"/><text x="90" y="423" class="t">RPLIDAR C1</text><text x="90" y="454" class="s">USB serial · obstacle sensing</text><rect class="box" x="890" y="95" width="250" height="105"/><text x="922" y="138" class="t">Pi Camera + Hailo</text><text x="922" y="169" class="s">CSI · PCIe</text><rect class="box" x="890" y="240" width="250" height="105"/><text x="922" y="283" class="t">TF02-Pro</text><text x="922" y="314" class="s">UART · downward range</text><rect class="box" x="890" y="385" width="250" height="105"/><text x="922" y="428" class="t">On-board Bluetooth</text><text x="922" y="459" class="s">Recipient handshake</text><rect class="opt" x="420" y="500" width="360" height="82"/><text x="485" y="537" class="t">Optional MedBox ESP32</text><text x="476" y="563" class="s">USB Bluetooth adapter · advisory status</text><path class="a" d="M308 172h70M308 432h48v-116h22M810 250h68M810 300h68M810 350h48v87h20"/><path class="b" d="M600 415v77"/></svg>
