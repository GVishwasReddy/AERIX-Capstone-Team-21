<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">AERIX delivery mission flow</title><desc id="desc">An operator-approved order flows through flight, recipient verification, precision delivery, and return.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#236b8e"/></marker><style>.bg{fill:#f4f8fb}.box{fill:#fff;stroke:#236b8e;stroke-width:3;rx:18}.optional{fill:#eef7f3;stroke:#33866b;stroke-width:3;rx:18}.t{font:700 22px system-ui,sans-serif;fill:#153247}.s{font:17px system-ui,sans-serif;fill:#39576b}.a{stroke:#236b8e;stroke-width:4;marker-end:url(#arrow)}.d{stroke:#33866b;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1200" height="570" rx="24"/><text x="60" y="58" class="t" font-size="30">AERIX · supervised delivery flow</text><g transform="translate(60 112)"><rect class="box" width="220" height="118"/><text x="22" y="44" class="t">1 · Order</text><text x="22" y="78" class="s">App → cloud record</text><text x="22" y="103" class="s">validated at the Pi</text></g><g transform="translate(350 112)"><rect class="box" width="220" height="118"/><text x="22" y="44" class="t">2 · Operator</text><text x="22" y="78" class="s">Reviews and accepts</text><text x="22" y="103" class="s">the mission in GCS</text></g><g transform="translate(640 112)"><rect class="box" width="220" height="118"/><text x="22" y="44" class="t">3 · Flight</text><text x="22" y="78" class="s">Navigation + avoidance</text><text x="22" y="103" class="s">to delivery area</text></g><g transform="translate(930 112)"><rect class="box" width="220" height="118"/><text x="22" y="44" class="t">4 · Find</text><text x="22" y="78" class="s">Camera and recipient</text><text x="22" y="103" class="s">selection workflow</text></g><path class="a" d="M280 171h56M570 171h56M860 171h56"/><g transform="translate(205 344)"><rect class="box" width="250" height="125"/><text x="22" y="45" class="t">5 · Verify</text><text x="22" y="79" class="s">BLE proof, signed GPS,</text><text x="22" y="105" class="s">and delivery gates</text></g><g transform="translate(475 344)"><rect class="box" width="250" height="125"/><text x="22" y="45" class="t">6 · Precision flow</text><text x="22" y="79" class="s">Rangefinder-guided</text><text x="22" y="105" class="s">approach and release</text></g><g transform="translate(745 344)"><rect class="box" width="250" height="125"/><text x="22" y="45" class="t">7 · Return</text><text x="22" y="79" class="s">RTL and landing</text><text x="22" y="105" class="s">outcome recorded</text></g><path class="a" d="M1040 230v58H330v48M455 406h15M725 406h15"/><rect class="optional" x="850" y="485" width="300" height="58"/><text x="875" y="521" class="t">Optional MedBox: status only</text><path class="d" d="M1000 485V242"/></svg>
